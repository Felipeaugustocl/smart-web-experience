<!-- Embed 4: scripts gerais, fica no fim do body -->
<script>
(function () {
  // 1) Mostra se a loja está aberta agora (seg a sex 9h-19h, sáb 9h-14h, horário de Brasília)
  var status = document.getElementById('status-loja');
  if (status) {
    var partes = new Intl.DateTimeFormat('pt-BR', {
      timeZone: 'America/Sao_Paulo', weekday: 'short', hour: 'numeric', minute: 'numeric', hour12: false
    }).formatToParts(new Date());
    var dia = '', hora = 0, minuto = 0;
    partes.forEach(function (p) {
      if (p.type === 'weekday') dia = p.value.replace('.', '').toLowerCase();
      if (p.type === 'hour') hora = parseInt(p.value, 10);
      if (p.type === 'minute') minuto = parseInt(p.value, 10);
    });
    var agora = hora + minuto / 60;
    var aberto = false;
    if (['seg', 'ter', 'qua', 'qui', 'sex'].indexOf(dia) !== -1) aberto = agora >= 9 && agora < 19;
    if (dia === 'sab') aberto = agora >= 9 && agora < 14;

    status.textContent = aberto ? 'Aberto agora · atendemos até ' + (dia === 'sab' ? '14h' : '19h')
                                : 'Fechado agora · mas o assistente do site funciona 24h';
    status.classList.add(aberto ? 'lm-aberto' : 'lm-fechado');
  }

  // 2) Animação de entrada: quando o bloco aparece na tela, ganha a classe .visivel
  var blocos = document.querySelectorAll('.lm-revela');
  if ('IntersectionObserver' in window) {
    var obs = new IntersectionObserver(function (itens) {
      itens.forEach(function (item) {
        if (item.isIntersecting) {
          item.target.classList.add('visivel');
          obs.unobserve(item.target);
        }
      });
    }, { threshold: 0.15 });
    blocos.forEach(function (b) { obs.observe(b); });
  } else {
    blocos.forEach(function (b) { b.classList.add('visivel'); });
  }

  // 3) Botão flutuante do WhatsApp com mensagem pronta
  // (empresa fictícia, então não tem número. Numa loja de verdade é só colocar aqui, ex: '5511999999999')
  var NUMERO_WHATSAPP = '';
  var msg = encodeURIComponent('Oi, Luminus! Vim pelo site e queria um orçamento.');
  var zap = document.createElement('a');
  zap.className = 'lm-zap';
  zap.href = 'https://wa.me/' + NUMERO_WHATSAPP + '?text=' + msg;
  zap.target = '_blank';
  zap.rel = 'noopener';
  zap.setAttribute('aria-label', 'Conversar pelo WhatsApp (abre em nova aba)');
  zap.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.2-.2-.2-.5-.4z"/></svg><span>WhatsApp</span>';
  document.body.appendChild(zap);

  // 4) Máscara no campo de WhatsApp do formulário: (11) 91234-5678
  var tel = document.getElementById('campo-whatsapp');
  if (tel) {
    tel.addEventListener('input', function () {
      var n = tel.value.replace(/\D/g, '').slice(0, 11);
      var f = n;
      if (n.length > 2) f = '(' + n.slice(0, 2) + ') ' + n.slice(2);
      if (n.length > 7) f = '(' + n.slice(0, 2) + ') ' + n.slice(2, 7) + '-' + n.slice(7);
      tel.value = f;
    });
  }

  // 5) Ano atual no rodapé
  var ano = document.getElementById('ano-atual');
  if (ano) ano.textContent = new Date().getFullYear();
})();
</script>
<style>
  .lm-aberto::before, .lm-fechado::before {
    content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle;
  }
  .lm-aberto::before { background: #2fbf71; }
  .lm-fechado::before { background: #c9c3b3; }
</style>
